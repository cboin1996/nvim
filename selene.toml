[config]
standard_library = "lua51"

[lints]
# lazy.nvim plugin specs mix string + key entries by design
mixed_table = "allow"
# inline `function() call() end` in keymap.set is idiomatic neovim Lua
multiple_statements = "allow"
# vim is a neovim builtin global; lua_ls handles undefined variable detection
undefined_variable = "allow"
unscoped_variables = "allow"
