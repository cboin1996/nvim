name: lint

on:
  push:
  pull_request:

jobs:
  selene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install selene
        run: |
          curl -fsSL \
            "https://github.com/Kampfkarren/selene/releases/latest/download/selene-linux.zip" \
            -o /tmp/selene.zip
          unzip /tmp/selene.zip selene -d ~/.local/bin
          chmod +x ~/.local/bin/selene
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: scripts/lint.sh
