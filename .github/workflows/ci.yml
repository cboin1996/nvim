name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  NVIM_VERSION: v0.10.4

jobs:
  boot:
    name: headless boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install neovim ${{ env.NVIM_VERSION }}
        run: |
          curl -fsSL \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz" \
            -o /tmp/nvim.tar.gz
          tar -C /tmp -xzf /tmp/nvim.tar.gz
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # Point neovim at the checked-out config
      - name: Set XDG_CONFIG_HOME
        run: echo "XDG_CONFIG_HOME=$(dirname $GITHUB_WORKSPACE)" >> "$GITHUB_ENV"

      - name: Cache lazy.nvim plugins
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim/lazy
          key: lazy-${{ hashFiles('lazy-lock.json') }}
          restore-keys: lazy-

      - name: Bootstrap plugins
        run: nvim --headless -c "Lazy sync" -c "qa" 2>&1 || true

      - name: Boot test
        run: scripts/boot-test.sh

  check-dap:
    name: DAP adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache debug adapters
        uses: actions/cache@v4
        with:
          path: |
            ~/debug-adapters
            ~/.virtualenvs/debugpy
          key: dap-${{ hashFiles('install.sh') }}

      - name: Install debug adapters
        run: |
          # debugpy
          if [[ ! -d ~/.virtualenvs/debugpy ]]; then
            python -m venv ~/.virtualenvs/debugpy
            ~/.virtualenvs/debugpy/bin/pip install --quiet debugpy
          fi

          # delve
          go install github.com/go-delve/delve/cmd/dlv@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          # js-debug
          if [[ ! -d ~/debug-adapters/js-debug ]]; then
            git clone --depth=1 https://github.com/microsoft/vscode-js-debug \
              ~/debug-adapters/js-debug
            cd ~/debug-adapters/js-debug && npm install --silent && npm run compile --silent
          fi

          # vscode-firefox-debug
          if [[ ! -d ~/debug-adapters/vscode-firefox-debug ]]; then
            git clone --depth=1 https://github.com/firefox-devtools/vscode-firefox-debug.git \
              ~/debug-adapters/vscode-firefox-debug
            cd ~/debug-adapters/vscode-firefox-debug && npm install --silent && npm run build --silent
          fi

      - name: Check DAP adapters
        run: scripts/check-dap.sh
